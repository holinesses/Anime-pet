name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: |
          FOUND=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "settings.gradle not found. Repo contents:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Building in $DIR"
          echo "DIR=$DIR" >> $GITHUB_ENV
          cd "$DIR"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: inventory-dancer
          path: ${{ env.DIR }}/build/libs/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Inventory Dancer build ${{ github.run_number }}
          files: ${{ env.DIR }}/build/libs/*.jar
